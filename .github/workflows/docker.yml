# Builds the container image and publishes it to the GitHub Container Registry (ghcr.io) whenever a
# release is published, tagged with the release number (v2.15 -> 2.15) and "latest".
# "Run workflow" on the Actions tab rebuilds from the branch you pick and publishes "latest"; type a version
# such as 2.15 to tag that too (for a release that was made before this workflow existed).
name: Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Also tag the image with this version, for example 2.15 (optional)
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # lets one build produce an image for both ordinary servers (amd64) and Raspberry Pi style ones (arm64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # The image's version label comes from the highest-priority tag, so the numbered tags outrank
          # "latest" (otherwise a manual run labelled the image "latest" instead of 2.15).
          tags: |
            type=match,pattern=v(.*),group=1,priority=300
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }},priority=300
            type=raw,value=latest,priority=100
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
